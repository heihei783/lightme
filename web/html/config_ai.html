<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightMe AI 配置</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/config_ai.css">
</head>
<body style="background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%); min-height: 100vh;">
    <div class="config-container">
        <a href="index.html" class="back-link">← 返回聊天</a>
        <h1>⚙️ AI 配置中心</h1>
        <p class="subtitle">管理模型预设、人格切换、功能开关</p>

        <!-- 功能开关 -->
        <div class="config-card">
            <h3 style="margin-top:0;color:#555;">功能开关</h3>
            <div class="toggle-row">
                <span class="label">RAG 知识库问答</span>
                <label class="toggle-switch"><input type="checkbox" id="toggle-rag" onchange="saveToggles()"><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row">
                <span class="label">Agent 智能体</span>
                <label class="toggle-switch"><input type="checkbox" id="toggle-agent" onchange="saveToggles()"><span class="toggle-slider"></span></label>
            </div>
            <div class="toggle-row">
                <span class="label">陪伴模式间隔 (秒)</span>
                <input type="number" id="companion-interval" value="10" min="3" max="120" style="width:70px;padding:6px 10px;border-radius:10px;border:1px solid #ddd;font-size:14px;text-align:center;" onchange="saveCompanionInterval()">
            </div>
            <div class="toggle-row">
                <span class="label">随机生图概率</span>
                <input type="number" id="image-gen-probability" value="0.08" min="0" max="1" step="0.01" style="width:70px;padding:6px 10px;border-radius:10px;border:1px solid #ddd;font-size:14px;text-align:center;" onchange="saveImageGenProbability()">
        </div>

        <!-- 知识库文件管理 -->
        <div class="config-card">
            <h3 style="margin-top:0;color:#555;">📚 知识库文件</h3>
            <div id="rag-file-list"></div>
            <div style="display:flex;gap:10px;margin-top:12px;">
                <input type="file" id="rag-file-input" accept=".txt,.md,.pdf,.docx" style="display:none;" onchange="uploadRagFile()">
                <button class="btn-add" onclick="document.getElementById('rag-file-input').click()">+ 上传文件</button>
            </div>
        </div>

        <!-- 模型配置卡片 -->
        <div class="config-card">
            <div class="tabs">
                <button class="tab-btn active" data-tab="chat">💬 对话模型</button>
                <button class="tab-btn" data-tab="embedding">📊 嵌入模型</button>
                <button class="tab-btn" data-tab="vision">👁️ 视觉模型</button>
                <button class="tab-btn" data-tab="image_gen">🎨 生图模型</button>
            </div>
            <div id="tab-chat" class="tab-content active"></div>
            <div id="tab-embedding" class="tab-content"></div>
            <div id="tab-vision" class="tab-content"></div>
            <div id="tab-image_gen" class="tab-content"></div>
        </div>

        <!-- 人格预设 -->
        <div class="config-card">
            <h3 style="margin-top:0;color:#555;">🎭 人格预设</h3>
            <div id="personality-list"></div>
            <button class="btn-add" onclick="openPersonalityModal()">+ 添加人格预设</button>
        </div>
    </div>

    <!-- 模型预设编辑弹窗 -->
    <div class="modal-overlay" id="model-modal">
        <div class="modal">
            <h3 id="model-modal-title">编辑预设</h3>
            <label>预设名称</label><input type="text" id="modal-name" placeholder="如: DeepSeek V4">
            <label>模型名称</label><input type="text" id="modal-model-name" placeholder="如: deepseek-v4-flash">
            <label>API Key</label><input type="text" id="modal-api-key" placeholder="sk-...">
            <label>Base URL</label><input type="text" id="modal-base-url" placeholder="https://api.deepseek.com">
            <label>Provider</label><input type="text" id="modal-provider" placeholder="如: deepseek">
            <div class="btn-row">
                <button class="btn btn-del" id="modal-delete" style="display:none;" onclick="deleteCurrentPreset()">删除</button>
                <button class="btn btn-edit" onclick="closeModal('model-modal')">取消</button>
                <button class="btn btn-switch" onclick="saveCurrentPreset()">保存</button>
            </div>
        </div>
    </div>

    <!-- 人格预设编辑弹窗 -->
    <div class="modal-overlay" id="personality-modal">
        <div class="modal">
            <h3 id="personality-modal-title">编辑人格预设</h3>
            <label>人格名称</label><input type="text" id="personality-name" placeholder="如: 猫娘">
            <label>提示词内容</label><textarea id="personality-content" placeholder="描述这个人格的特点..."></textarea>
            <div class="btn-row">
                <button class="btn btn-del" id="personality-delete" style="display:none;" onclick="deletePersonality()">删除</button>
                <button class="btn btn-edit" onclick="closeModal('personality-modal')">取消</button>
                <button class="btn btn-switch" onclick="savePersonality()">保存</button>
            </div>
        </div>
    </div>

    <script src="../js/config_ai.js"></script>
</body>
</html>
