<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightMe AI 终端</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🤖</text></svg>">
    <link rel="stylesheet" href="../css/index.css">
    <script>const API_BASE = 'http://127.0.0.1:8000';</script>
    <script src="../js/live2d-sdk.js"></script>
    <script src="../js/LAppDefine.js"></script>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn">+ 新建对话</button>
            </div>
            <div id="session-list" class="session-list"></div>
        </div>

        <div class="live2d-side" id="live2d-container">
            <canvas id="live2d-canvas"></canvas>
            <div id="live2d-msg-box" class="live2d-msg-box"></div>
            <div class="live2d-controls">
                <button id="l2d-char-btn" title="切换角色">🔄</button>
                <button id="l2d-voice-btn" title="语音输入">🎤</button>
            </div>
        </div>

        <div class="chat-side">
            <div class="header">
                <h2 id="current-title">LightMe System</h2>
                <div class="header-right">
                    <select id="tts-voice-select" title="切换TTS语音" class="header-select"></select>
                    <button id="tts-mute-btn" title="关闭语音">🔊</button>
                    <button id="companion-btn" title="AI 陪伴 - 截图给 AI 看看你的屏幕">陪伴 👀</button>
                    <button id="tools-btn" title="工具 & 技能">🛠</button>
                    <button id="config-btn" title="AI 配置" onclick="window.location.href='config_ai.html'">⚙️</button>
                    <span class="status-dot"></span>
                </div>
            </div>

            <div id="chat-window"></div>

            <div id="image-preview-row" style="display:none;">
                <img id="image-preview" src="" alt="预览">
                <button id="remove-img-btn" title="移除图片">✖</button>
            </div>
            <div class="input-area">
                <button id="upload-img-btn" title="上传图片">🖼</button>
                <input type="file" id="image-input" accept="image/*" style="display:none;">
                <input type="text" id="user-input" placeholder="输入消息..." autocomplete="off">
                <button id="send-btn">发送</button>
            </div>
        </div>
    </div>

    <!-- 隐藏的头像上传 input -->
    <input type="file" id="avatar-file-input" accept="image/*" style="display:none;">

    <!-- 工具 & 技能 弹窗 -->
    <div id="tools-modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-panel">
            <div class="modal-header">
                <h3>🛠 工具 & 技能</h3>
                <button id="tools-modal-close" class="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-summary" id="modal-summary"></div>
                <div class="modal-tab-bar">
                    <button class="modal-tab active" data-tab="skills-pane">技能列表</button>
                    <button class="modal-tab" data-tab="tools-pane">工具列表</button>
                </div>
                <div id="skills-pane" class="modal-pane"></div>
                <div id="tools-pane" class="modal-pane" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="../js/live2d-ctrl.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
